version: '3'
services:
  db:
    image: postgres:18
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: prisma
      POSTGRES_DB: gnucash
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:5-alpine
    ports:
      - 6379:6379
  app:
    build:
      context: ./gnucash-adonis
      dockerfile: Dockerfile
    ports:
      - 3333:3333
    environment:
      DB_CONNECTION: pg
      PG_HOST: db
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: prisma
      PG_DB_NAME: gnucash
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
